{% extends "base.html" %}
{% block content %}
<div class="container mt-5" style="max-width:500px">
  <div class="card shadow">
    <div class="card-body p-4 text-center">
      <h3>🔐 تفعيل حسابك - Star House</h3>
      <p class="text-muted">دخل الكود اللي ظهرلك (للتجربة يظهر في الـ console) - بعدين هيتبعت بالإيميل</p>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input name="otp" class="form-control form-control-lg text-center" placeholder="123456" maxlength="6" required style="letter-spacing:8px">
        <button class="btn btn-warning w-100 mt-3">تفعيل الحساب ✅</button>
      </form>
      <form action="{{ url_for('main.send_otp') }}" method="POST" class="mt-2">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-link">إعادة إرسال الكود 🔄</button>
      </form>
      <small class="text-muted">الكود صالح 10 دقائق فقط</small>
    </div>
  </div>
</div>
{% endblock %}
