{% extends "base.html" %}
{% block content %}
<div class="container mt-4" dir="rtl" style="max-width:700px;">
  <h3>🏦 حاسبة التمويل العقاري</h3>
  <div class="card p-4 shadow">
    <div class="row g-3">
      <div class="col-md-6"><label>سعر العقار</label><input type="number" id="price" class="form-control" value="1000000"></div>
      <div class="col-md-6"><label>مقدم %</label><input type="number" id="down" class="form-control" value="20"></div>
      <div class="col-md-6"><label>سنوات</label><input type="number" id="years" class="form-control" value="10"></div>
      <div class="col-md-6"><label>فائدة %</label><input type="number" id="rate" class="form-control" value="12"></div>
    </div>
    <button onclick="calc()" class="btn btn-warning w-100 mt-3">احسب</button>
    <div id="result" class="mt-4 alert alert-success d-none"></div>
  </div>
</div>
<script>
function calc(){
  let price=parseFloat(document.getElementById('price').value);
  let down=parseFloat(document.getElementById('down').value);
  let years=parseInt(document.getElementById('years').value);
  let rate=parseFloat(document.getElementById('rate').value);
  fetch(`/api/mortgage-calc?price=${price}&down=${down}&years=${years}&rate=${rate}`).then(r=>r.json()).then(d=>{
    document.getElementById('result').classList.remove('d-none');
    document.getElementById('result').innerHTML=`القرض: ${d.loan.toLocaleString()} ج<br>القسط الشهري: ${d.monthly.toLocaleString()} ج<br>الإجمالي: ${d.total.toLocaleString()} ج<br>الفوائد: ${d.interest.toLocaleString()} ج`;
  });
}
calc();
</script>
{% endblock %}
