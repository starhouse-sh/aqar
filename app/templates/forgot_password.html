<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيت كلمة السر - Star House</title>
<style>
body{font-family:Cairo, sans-serif; background:#f5f7fb; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0}
.card{background:#fff; padding:30px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.1); width:100%; max-width:400px}
h2{color:#0d2a54; text-align:center; margin-bottom:20px}
input{width:100%; padding:14px; border:1px solid #ddd; border-radius:10px; margin:10px 0; font-size:16px; box-sizing:border-box}
button{width:100%; padding:14px; background:#0d2a54; color:#fff; border:none; border-radius:10px; font-size:16px; cursor:pointer; margin-top:10px}
button:hover{background:#163d7a}
button:disabled{background:#999}
.msg{padding:12px; border-radius:8px; margin:10px 0; display:none}
.success{background:#d4edda; color:#155724}
.error{background:#f8d7da; color:#721c24}
.step{display:none}
.step.active{display:block}
small{color:#666; display:block; margin-top:10px; text-align:center}
</style>
</head>
<body>
<div class="card">
  <h2>🏠 Star House - نسيت كلمة السر</h2>
  <div id="step1" class="step active">
    <p>اكتب رقم موبايلك المسجل هيوصلك كود SMS</p>
    <input type="text" name="prevent_autofill" style="display:none" autocomplete="off">
    <input type="tel" id="forgotPhoneInput" name="forgot_phone_xyz" placeholder="01xxxxxxxxx" autocomplete="off" autocapitalize="off" spellcheck="false" value="">
    <button onclick="sendCode()" id="btn1">إرسال كود التحقق</button>
    <div id="msg1" class="msg"></div>
    <small>هيوصلك من <b>Test Sender</b> لحد ما STAR HOUSE يتوافق</small>
  </div>
  <div id="step2" class="step">
    <p>تم ارسال كود مكون من 6 ارقام إلى رقم الهاتف <span id="phoneShow"></span> برجاء تفقد صندوق الرسائل فى هاتفكم</p>
    <input type="text" id="otp" placeholder="123456" maxlength="6" autocomplete="off">
    <button onclick="verifyCode()" id="btn2">تأكيد الكود</button>
    <button onclick="resendCode()" style="background:#eee; color:#333; margin-top:8px">إعادة إرسال الكود</button>
    <div id="msg2" class="msg"></div>
    <small>الكود صالح 5 دقايق فقط</small>
  </div>
  <div id="step3" class="step">
    <p style="color:green">✅ تم التحقق - اكتب باسورد جديد</p>
    <input type="password" id="newPass" placeholder="كلمة السر الجديدة" autocomplete="new-password">
    <input type="password" id="confirmPass" placeholder="تأكيد كلمة السر" autocomplete="new-password">
    <button onclick="resetPass()" id="btn3">تغيير كلمة السر</button>
    <div id="msg3" class="msg"></div>
  </div>
</div>
<script>
let currentPhone = "";
function getPhone(){ return document.getElementById("forgotPhoneInput").value.trim(); }
function setPhone(v){ document.getElementById("forgotPhoneInput").value = v; }
window.onload = function(){
  setPhone("");
  const params = new URLSearchParams(window.location.search);
  const phoneFromUrl = params.get('phone');
  if(phoneFromUrl && phoneFromUrl.length >= 11){
    setPhone(phoneFromUrl);
    currentPhone = phoneFromUrl;
  } else {
    setPhone("");
    currentPhone = "";
  }
  setTimeout(function(){
    if(!phoneFromUrl){ setPhone(""); }
  }, 500);
}
function showMsg(id, text, type){
  const el = document.getElementById(id);
  el.style.display="block";
  el.textContent=text;
  el.className="msg "+type;
}
function sendCode(){
  const phone = getPhone() || currentPhone;
  if(!phone || phone.length < 11){ showMsg("msg1","اكتب رقم صحيح 11 رقم","error"); return; }
  currentPhone = phone;
  document.getElementById("btn1").disabled=true;
  document.getElementById("btn1").textContent="جاري الإرسال...";
  fetch("/send-sms-otp", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({phone: phone})})
  .then(r=>r.json()).then(data=>{
    document.getElementById("btn1").disabled=false;
    document.getElementById("btn1").textContent="إرسال كود التحقق";
    if(data.success){
      document.getElementById("phoneShow").textContent=phone;
      document.getElementById("step1").classList.remove("active");
      document.getElementById("step2").classList.add("active");
      showMsg("msg2","تم ارسال كود مكون من 6 ارقام إلى رقم الهاتف " + phone + " برجاء تفقد صندوق الرسائل فى هاتفكم","success");
    } else { showMsg("msg1","فشل الإرسال: "+(data.message||'خطأ'),"error"); }
  }).catch(e=>{
    document.getElementById("btn1").disabled=false;
    document.getElementById("btn1").textContent="إرسال كود التحقق";
    showMsg("msg1","خطأ في الاتصال: "+e,"error");
  });
}
function verifyCode(){
  const otp = document.getElementById("otp").value.trim();
  if(otp.length != 6){ showMsg("msg2","الكود 6 أرقام","error"); return; }
  document.getElementById("btn2").disabled=true;
  fetch("/verify-sms-otp", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({phone: currentPhone, otp: otp})})
  .then(r=>r.json()).then(data=>{
    document.getElementById("btn2").disabled=false;
    if(data.success){
      document.getElementById("step2").classList.remove("active");
      document.getElementById("step3").classList.add("active");
    } else { showMsg("msg2", data.message, "error"); }
  });
}
function resetPass(){
  const p1 = document.getElementById("newPass").value;
  const p2 = document.getElementById("confirmPass").value;
  if(p1.length < 6){ showMsg("msg3","الباسورد لازم 6 حروف على الأقل","error"); return; }
  if(p1 !== p2){ showMsg("msg3","الباسورد مش متطابق","error"); return; }
  document.getElementById("btn3").disabled=true;
  fetch("/reset-sms-password", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({phone: currentPhone, password: p1})})
  .then(r=>r.json()).then(data=>{
    if(data.success){
      showMsg("msg3","✅ تم تغيير الباسورد - حولك لصفحة الدخول...","success");
      setTimeout(()=>{ window.location.href="/login"; }, 2000);
    } else { document.getElementById("btn3").disabled=false; showMsg("msg3", data.message, "error"); }
  });
}
function resendCode(){
  // إعادة إرسال الكود لنفس الرقم من غير ما نرجع لخطوة 1
  if(!currentPhone){
    currentPhone = getPhone();
  }
  if(!currentPhone || currentPhone.length < 11){
    showMsg("msg2","اكتب رقم صحيح الأول","error");
    return;
  }
  fetch("/send-sms-otp", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({phone: currentPhone})})
  .then(r=>r.json()).then(data=>{
    if(data.success){
      showMsg("msg2","تم ارسال كود مكون من 6 ارقام إلى رقم الهاتف " + currentPhone + " برجاء تفقد صندوق الرسائل فى هاتفكم","success");
    } else {
      showMsg("msg2","فشل الإرسال: "+(data.message||'خطأ'),"error");
    }
  }).catch(e=>{
    showMsg("msg2","خطأ في الاتصال: "+e,"error");
  });
}
function backTo1(){
  document.getElementById("step2").classList.remove("active");
  document.getElementById("step1").classList.add("active");
}
</script>
</body>
</html>
