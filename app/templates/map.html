{% extends "base.html" %}
{% block content %}
<div class="container mt-4" dir="rtl">
  <h3 class="mb-3">🗺️ البحث على الخريطة - عقار ستار هاوس</h3>
  <div id="map" style="height:600px; border-radius:15px; border:3px solid gold;"></div>
</div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map').setView([30.0444,31.2357], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
{% for p in properties %}
{% if p.latitude and p.longitude %}
L.marker([{{p.latitude}}, {{p.longitude}}]).addTo(map).bindPopup("<b>{{p.title}}</b><br>{{p.location}}<br>{{p.price}} ج<br><a href='/property/{{p.id}}' class='btn btn-sm btn-primary mt-1'>التفاصيل</a>");
{% endif %}
{% endfor %}
</script>
{% endblock %}
