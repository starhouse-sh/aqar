{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h3>📜 سجل تعديلات العقار: {{ prop.title }}</h3>
  <a href="{{ url_for('main.property_detail', property_id=prop.id) }}" class="btn btn-secondary mb-3">رجوع للعقار</a>
  {% if logs %}
  <table class="table table-bordered">
    <thead><tr><th>التاريخ</th><th>العملية</th></tr></thead>
    <tbody>
      {% for log in logs %}
      <tr><td>{{ log.timestamp.strftime('%Y-%m-%d %H:%M') }}</td><td>{{ log.action }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p class="text-muted">لا يوجد سجل تعديلات لهذا العقار</p>
  {% endif %}
</div>
{% endblock %}
